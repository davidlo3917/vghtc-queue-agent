<h2 style="font-size:64px;font-weight:700;line-height:1.15">三條底線</h2>

<div style="flex:1;display:flex;flex-direction:column;gap:16px;background:#EEF2F1;padding:44px;border-radius:16px">

<p style="font-size:28px;line-height:1.5;color:#4A5568">無需登入的 API；頻率等於官網刷新；每一輪都有紀錄可稽核</p>

<p style="font-size:28px;line-height:1.5;color:#4A5568">不用身分證／病歷號 API；不蒐集定位；訂閱結束即刪 LINE ID</p>
